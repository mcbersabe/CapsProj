<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Reservation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            padding-top: 100px;
            /* Adjust to push content below the menu bar */
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Menu Bar Styles */
        .menu-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background-color: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .menu-list {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .menu-list li {
            display: inline-block;
        }

        .menu-list li a {
            text-decoration: none;
            color: #333;
            font-size: 1.1em;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .menu-list li a:hover {
            color: #007BFF;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bell-icon {
            font-size: 1.5em;
            cursor: pointer;
            color: #555;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #007BFF;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bell-icon:hover,
        .profile-icon:hover {
            color: #007BFF;
        }

        #clientUsername {
            font-weight: bold;
            color: #007BFF;
            /* Customize this color */
            text-decoration: none;
            margin-right: 20px;
            transition: color 0.3s ease;
        }

        #clientUsername:hover {
            color: #0056b3;
            /* A slightly darker shade for hover */
        }

        /* Dropdown Menu Styling */
        .dropdown-menu {
            display: none;
            /* Hidden by default */
            position: absolute;
            top: 70px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            padding: 10px 0;
            width: 150px;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }

        .dropdown-menu a:hover {
            background-color: #f1f1f1;
        }

        .notification-box {
            display: none;
            /* Hidden by default */
            position: absolute;
            top: 70px;
            right: 50px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            width: 200px;
            padding: 10px;
        }

        .notification-box p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        .notification-box p:hover {
            background-color: #f1f1f1;
        }

        .main-container {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            flex: 1;
        }

        .sidebar {
            width: auto;
            max-width: 200px;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            /* Rounded edges */
            position: sticky;
            top: 0;
            margin-right: 20px;
            height: 100px;
            /* Set a specific height for the sidebar */
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #007bff;
            color: #fff;
        }

        .content {
            flex: 1;
            padding: 20px;
            position: relative;
            /* To position dropdown container absolutely */
        }

        .dropdown-container {
            position: absolute;
            top: 20px;
            left: 0;
            /* Adjust position to top-left of the first product */
            z-index: 10;
        }

        #category-filter {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            /* Make text bold */
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 60px;
            /* Adjust space for dropdown */
        }

        .product {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: calc(33.333% - 20px);
            margin-bottom: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-image {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #007bff;
            /* Add border to the product icon */
            border-radius: 10px;
            /* Rounded edges */
            padding: 10px;
            /* Add padding to create space around the image */
            box-sizing: border-box;
            /* Ensure padding is included in the width and height */
        }

        .product-image img {
            max-width: 90%;
            /* Make image smaller */
            max-height: 90%;
            /* Make image smaller */
            object-fit: cover;
            border-radius: 8px;
            /* Slightly rounded edges for the image */
        }

        .product-info {
            padding: 15px;
        }

        .product-info h2 {
            font-size: 1.2em;
            margin: 0 0 10px;
        }

        .product-info p {
            font-size: 1em;
            color: #555;
            margin: 0;
        }

        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        /* Modal styles */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            width: 50%;
            display: flex;
            flex-direction: row;
        }

        .modal-left {
            flex: 1;
            padding-right: 20px;
        }

        .modal-left img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .modal-right {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .modal-right h2,
        .modal-right p {
            margin: 10px 0;
        }

        #modal-add-quantity {
            width: 50px;
        }

        #modal-add-button {
            margin-top: 10px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #modal-add-button:hover {
            background-color: #218838;
        }

        /* Modal close button */
        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="menu-bar">
        <ul class="menu-list">
            <li><a id="clientUsername">Welcome, [User]</a></li>
            <li><a href="main-client.html">Home</a></li>
            <li><a href="client-pets.html">Pets</a></li>
            <li><a href="aproducts.html">Shop</a></li>
            <li><a href="appmnts.html">Appointments</a></li>
        </ul>

        <div class="profile-section">
            <span class="bell-icon" onclick="toggleNotification()">🔔</span>
            <div class="notification-box" id="notificationBox">
                <p>No new notifications</p>
            </div>

            <!-- Profile Icon with Dropdown -->
            <div class="profile-icon" onclick="toggleDropdown()">
                <img src="../images/profile.jpg" alt="Profile" class="profile-img">
                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html">Profile</a>
                    <a id="logout-link">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <a href="aproducts.html">Products</a>
            <a href="cart.html">Reservations</a>
        </div>
        <div class="content">
            <div class="dropdown-container">
                <select id="category-filter">
                    <option value="">All</option>
                    <option value="food">Food</option>
                    <option value="toys">Toys</option>
                    <option value="grooming">Grooming Supplies</option>
                </select>
            </div>
            <div id="product-container" class="product-container">
                <!-- Products will be dynamically added here -->
            </div>

            <div class="pagination">
                <button id="prev-page">&lt;</button>
                <span id="page-info"></span>
                <button id="next-page">&gt;</button>
            </div>
        </div>

        <!-- Product Modal (hidden initially) -->
        <div id="product-modal" class="modal">
            <div class="modal-content">
                <div class="modal-left">
                    <img id="modal-product-image" src="" alt="Product Image">
                </div>
                <div class="modal-right">
                    <h2 id="modal-product-name">Product Name</h2>
                    <p id="modal-product-description">Product Description</p>
                    <p id="modal-product-price">$0.00</p>
                    <p id="modal-product-quantity">In Stock: <span id="modal-stock-quantity">0</span></p>

                    <!-- Add Quantity Selector -->
                    <label for="modal-add-quantity">Quantity:</label>
                    <input type="number" id="modal-add-quantity" value="1" min="1">

                    <!-- Add Button -->
                    <button id="modal-add-button">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const categoryFilter = document.getElementById('category-filter');
        const productContainer = document.getElementById('product-container');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const pageInfo = document.getElementById('page-info');

        const modal = document.getElementById('product-modal');
        const modalImage = document.getElementById('modal-product-image');
        const modalName = document.getElementById('modal-product-name');
        const modalDescription = document.getElementById('modal-product-description');
        const modalPrice = document.getElementById('modal-product-price');
        const modalQuantity = document.getElementById('modal-stock-quantity');
        const modalAddQuantity = document.getElementById('modal-add-quantity');
        const modalAddButton = document.getElementById('modal-add-button');

        let currentProductId = null; // To store the product ID
        let currentPage = 1;
        const limit = 6; // Show 6 products per page

        function fetchProducts(category = '', page = 1) {
            let url = `/api/products?page=${page}&limit=${limit}`;

            if (category) {
                url += `&category=${category}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const products = data.products;
                    const totalPages = data.totalPages;

                    productContainer.innerHTML = ''; // Clear existing products
                    if (products.length === 0) {
                        productContainer.innerHTML = '<p>No products available.</p>';
                    } else {
                        products.forEach(product => {
                            const productElement = `
                            <div class="product" data-id="${product.id}">
                                <div class="product-image">
                                    <img src="${product.image_url ? product.image_url : '/images/default-product.jpg'}" alt="${product.name}">
                                </div>
                                <div class="product-info">
                                    <h2>${product.name}</h2>
                                    <p>$${product.price}</p>
                                    <p>Quantity: ${product.stock_quantity}</p>
                                </div>
                            </div>
                            `;
                            productContainer.innerHTML += productElement;
                        });


                        // Add event listener for each product click
                        document.querySelectorAll('.product').forEach(productElement => {
                            productElement.addEventListener('click', (e) => {
                                const productId = productElement.getAttribute('data-id');
                                const product = products.find(p => p.id === parseInt(productId));
                                openModal(product);
                            });
                        });
                    }

                    // Update pagination info
                    pageInfo.textContent = `Page ${page} of ${totalPages}`;

                    // Disable/enable buttons based on page
                    prevPageBtn.disabled = (page === 1);
                    nextPageBtn.disabled = (page === totalPages);
                })
                .catch(error => console.error('Error fetching products:', error));
        }

        // Fetch products initially
        fetchProducts('', currentPage);

        // Function to open the modal
        function openModal(product) {
            modalImage.src = product.image_url ? product.image_url : '/images/default-product.jpg';
            modalName.textContent = product.name;
            modalDescription.textContent = product.description;
            modalPrice.textContent = `$${product.price}`;
            modalQuantity.textContent = product.stock_quantity;
            modalAddQuantity.value = 1; // Reset quantity input
            currentProductId = product.id; // Store the current product ID

            // Show the modal
            modal.style.display = 'flex';
        }

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Handle Add to Cart functionality
        modalAddButton.addEventListener('click', () => {
            const quantityToAdd = parseInt(modalAddQuantity.value);

            // Make sure currentProductId and quantity are valid
            if (!currentProductId || isNaN(quantityToAdd) || quantityToAdd <= 0) {
                alert('Invalid quantity or product.');
                return;
            }

            // Send a POST request to add the item to the cart
            fetch('/api/cart/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: userId,        // Replace this with the actual user ID from your session
                    productId: currentProductId,
                    quantity: quantityToAdd
                })
            })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Failed to add product to cart');
                    }
                })
                .then(data => {
                    console.log(data.message);  // "Item added to cart"
                    // Optionally, show a success message to the user
                    alert('Item successfully added to cart');
                    // Close modal after adding to cart
                    modal.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error adding product to cart.');
                });
        });


        // Handle category change
        categoryFilter.addEventListener('change', (event) => {
            const selectedCategory = event.target.value;
            currentPage = 1; // Reset to the first page when category changes
            fetchProducts(selectedCategory, currentPage);
        });

        // Handle pagination
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                fetchProducts(categoryFilter.value, currentPage);
            }
        });

        nextPageBtn.addEventListener('click', () => {
            currentPage++;
            fetchProducts(categoryFilter.value, currentPage);
        });
    });

    fetch('/current-user')
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('Failed to fetch user data');
            }
        })
        .then(data => {
            // Update UI to display current user's information
            const welcomeMessage = document.getElementById('clientUsername');
            welcomeMessage.textContent = `Welcome, ${data.user.username}`;
            userId = data.user.id;
            console.log('User ID:', userId);
        })
        .catch(error => {
            console.error('Error fetching user data:', error);
        });

    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    // Close dropdown when clicked outside
    window.onclick = function (event) {
        if (!event.target.matches('.profile-img')) {
            const dropdowns = document.getElementsByClassName('dropdown-menu');
            for (let i = 0; i < dropdowns.length; i++) {
                const openDropdown = dropdowns[i];
                if (openDropdown.style.display === 'block') {
                    openDropdown.style.display = 'none';
                }
            }
        }
    }

    function toggleNotification() {
        const notificationBox = document.getElementById('notificationBox');
        notificationBox.style.display = notificationBox.style.display === 'block' ? 'none' : 'block';
    }

    // Close notification box when clicking outside
    window.onclick = function (event) {
        if (!event.target.matches('.bell-icon')) {
            const notifications = document.getElementsByClassName('notification-box');
            for (let i = 0; i < notifications.length; i++) {
                const openNotification = notifications[i];
                if (openNotification.style.display === 'block') {
                    openNotification.style.display = 'none';
                }
            }
        }

        // Close profile dropdown as well if clicked outside
        if (!event.target.matches('.profile-img')) {
            const dropdowns = document.getElementsByClassName('dropdown-menu');
            for (let i = 0; i < dropdowns.length; i++) {
                const openDropdown = dropdowns[i];
                if (openDropdown.style.display === 'block') {
                    openDropdown.style.display = 'none';
                }
            }
        }
    }

    // For logout link
    document.getElementById('logout-link').addEventListener('click', function (event) {
        event.preventDefault(); // Prevent the default link behavior

        // Display a confirmation dialog
        const confirmed = confirm('Are you sure you want to logout?');
        if (!confirmed) {
            return; // Do nothing if the user cancels the logout
        }

        // Perform logout via AJAX
        fetch('/logout', {
            method: 'POST'
        })
            .then(response => {
                if (response.ok) {
                    // Redirect to login page after successful logout
                    window.location.href = '/login.html';
                } else {
                    console.error('Logout failed:', response.statusText);
                }
            })
            .catch(error => {
                console.error('Error during logout:', error);
            });
    });

</script>

</html>
