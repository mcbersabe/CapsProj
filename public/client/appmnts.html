<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            padding-top: 100px;
            /* Adjust to push content below the menu bar */
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Menu Bar Styles */
        .menu-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background-color: white;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .menu-list {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .menu-list li {
            display: inline-block;
        }

        .menu-list li a {
            text-decoration: none;
            color: #333;
            font-size: 1.1em;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .menu-list li a:hover {
            color: #007BFF;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bell-icon {
            font-size: 1.5em;
            cursor: pointer;
            color: #555;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #007BFF;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bell-icon:hover,
        .profile-icon:hover {
            color: #007BFF;
        }

        #clientUsername {
            font-weight: bold;
            color: #007BFF;
            /* Customize this color */
            text-decoration: none;
            margin-right: 20px;
            transition: color 0.3s ease;
        }

        #clientUsername:hover {
            color: #0056b3;
            /* A slightly darker shade for hover */
        }

        /* Dropdown Menu Styling */
        .dropdown-menu {
            display: none;
            /* Hidden by default */
            position: absolute;
            top: 70px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            padding: 10px 0;
            width: 150px;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
        }

        .dropdown-menu a:hover {
            background-color: #f1f1f1;
        }

        .notification-box {
            display: none;
            /* Hidden by default */
            position: absolute;
            top: 70px;
            right: 50px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            width: 200px;
            padding: 10px;
        }

        .notification-box p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        .notification-box p:hover {
            background-color: #f1f1f1;
        }

        #calendar {
            max-width: 600px;
            /* Adjust this to make the calendar smaller */
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .fc-daygrid-day-frame {
            height: 60px;
            /* Adjust this to control the height of each box */
        }


        /* Styles for reservation count */
        .reservation-count {
            display: block;
            text-align: center;
            font-size: 14px;
            color: #333;
            position: absolute;
            /* Use absolute positioning */
            bottom: 5px;
            /* Position at the bottom of the cell */
            left: 50%;
            transform: translateX(-50%);
            /* Center horizontally */
            z-index: 1;
            /* Ensure it's above other elements */
        }

        /* Styles for non-clickable dates */
        .non-clickable {
            background-color: #e0e0e0;
            /* Gray background for non-clickable dates */
            pointer-events: none;
            /* Disable interactions */
            cursor: not-allowed;
        }

        /* Hide reservation count for non-clickable dates */
        .non-clickable .reservation-count {
            display: none;
        }

        /* Styles for clickable dates */
        .clickable {
            cursor: pointer;
            position: relative;
        }

        /* Hover effect for clickable dates */
        .clickable:hover {
            background-color: #b2ebf2;
        }

        .fc-timegrid-slot-clickable-slot {
            cursor: pointer;
        }

        .fc-timegrid-slot-non-clickable-slot {
            cursor: not-allowed;
            background-color: #f5f5f5;
            /* Optional: change the background color for non-clickable slots */
        }

        .fc-daygrid-day .reservation-count {
            font-size: 14px;
            font-weight: bold;
            color: #000;
            /* Text color */
            text-align: center;
            margin-top: 10px;
            /* Adjusts positioning inside the box */
            display: block;
            /* Ensures it's displayed as a block-level element */
        }

        /* Style for different booking statuses */
        .fc-daygrid-day {
            position: relative;
            /* Ensure the positioning context for child elements */
        }

        .fc-daygrid-day.non-clickable {
            background-color: #d3d3d3;
            /* Gray color for non-clickable dates */
        }

        .fc .fc-daygrid-day {
            border-radius: 10px;
            /* Rounded edges */
            background-color: #f8f9fa;
            /* Light background like the menu bar */
        }

        .fc .fc-daygrid-day:hover {
            background-color: #d1e7dd;
            /* Hover effect similar to the pets page */
        }

        .fc-toolbar-title {
            font-family: 'Arial', sans-serif;
            /* Use the same font if needed */
            color: #333;
        }

        .fc-daygrid-day:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transform: scale(1.05);
            transition: all 0.2s ease-in-out;
        }


        .reservation-count {
            position: absolute;
            /* Adjust positioning as needed */
            bottom: 5px;
            /* Adjust as needed */
            right: 5px;
            /* Adjust as needed */
            font-size: 0.8em;
            color: #333;
        }

        /* Modal styles */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            /* Transparent background */
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* Close button */
        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            color: #333;
            font-size: 24px;
            cursor: pointer;
        }

        /* Form and input field styling */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .input-field,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: #f9f9f9;
            transition: border-color 0.2s ease-in-out;
        }

        .input-field:focus,
        select:focus {
            border-color: #007bff;
            /* Accent color */
        }

        .submit-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #0056b3;
            /* Darker blue on hover */
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .date-display {
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="menu-bar">
        <ul class="menu-list">
            <li><a id="clientUsername">Welcome, [User]</a></li>
            <li><a href="main-client.html">Home</a></li>
            <li><a href="client-pets.html">Pets</a></li>
            <li><a href="aproducts.html">Shop</a></li>
            <li><a href="appmnts.html">Appointments</a></li>
        </ul>

        <div class="profile-section">
            <span class="bell-icon" onclick="toggleNotification()">🔔</span>
            <div class="notification-box" id="notificationBox">
                <p>No new notifications</p>
            </div>

            <!-- Profile Icon with Dropdown -->
            <div class="profile-icon" onclick="toggleDropdown()">
                <img src="../images/profile.jpg" alt="Profile" class="profile-img">
                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html">Profile</a>
                    <button id="logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <div id="content">
        <div id="calendar"></div>
    </div>

    <!-- Reservation Modal -->
    <div id="reservationModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reserve this Date</h2>
            <form id="reservationForm">
                <div class="form-group">
                    <label for="reservationDate">Selected Date</label>
                    <div id="reservationDate" class="date-display"></div>
                </div>

                <div class="form-group">
                    <label for="timeSelect">Select Time</label>
                    <select id="timeSelect" class="input-field">
                        <option value="9:00 AM">9:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="12:00 PM">12:00 PM</option>
                        <option value="1:00 PM">1:00 PM</option>
                        <option value="2:00 PM">2:00 PM</option>
                        <option value="3:00 PM">3:00 PM</option>
                        <option value="4:00 PM">4:00 PM</option>
                        <option value="5:00 PM">5:00 PM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="petSelect">Select Pet</label>
                    <select id="petSelect" class="input-field">
                        <!-- Pets will be populated dynamically -->
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="submit-btn">Submit Reservation</button>
                </div>
            </form>
        </div>
    </div>





</body>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next',
                center: 'title',
                right: '' // Removed the "today", "month", and "day" buttons
            },

            dayCellDidMount: function (info) {
                var date = new Date(info.date);
                var formattedDate = date.toLocaleDateString('en-CA');
                var today = new Date();
                today.setHours(0, 0, 0, 0);

                var daysDifference = (date - today) / (1000 * 60 * 60 * 24);

                // Disable past dates, today, and the next 3 days
                if (daysDifference < 0 || daysDifference <= 2) {
                    info.el.classList.add('non-clickable');
                    info.el.style.backgroundColor = '#e0e0e0'; // Gray for non-clickable dates

                    // Remove any existing reservation count element
                    let countElement = info.el.querySelector('.reservation-count');
                    if (countElement) {
                        countElement.remove();
                    }
                } else {
                    // For clickable dates
                    info.el.classList.add('clickable');
                    info.el.addEventListener('click', function () {
                        handleDayClick(formattedDate); // Make clickable dates trigger modal
                    });

                    // Fetch confirmed reservation count for this date
                    fetch(`/api/getConfirmedReservations?date=${formattedDate}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.maxReservations !== undefined) {
                                const confirmed = data.confirmedReservations;
                                const max = data.maxReservations;

                                // Create the reservation count element
                                let countElement = document.createElement('span');
                                countElement.classList.add('reservation-count');
                                countElement.innerHTML = `${confirmed}/${max}`;
                                info.el.appendChild(countElement);

                                if (confirmed >= max) {
                                    // Fully booked: red, non-clickable
                                    info.el.classList.remove('clickable');
                                    info.el.classList.add('non-clickable');
                                    info.el.style.backgroundColor = '#ffcdd2'; // Red for fully booked
                                }
                            }
                        })
                        .catch(error => console.error('Error fetching reservations:', error));
                }
            },

            editable: false,
            selectable: false
        });

        calendar.render();

        function handleDayClick(date) {
            var modal = document.getElementById('reservationModal');
            var reservationDateDisplay = document.getElementById('reservationDate');
            reservationDateDisplay.innerHTML = date; // Set the date in the form

            // Fetch the current user's pets
            fetch('/api/getUserPets')
                .then(response => response.json())
                .then(pets => {
                    var petSelect = document.getElementById('petSelect');
                    petSelect.innerHTML = ''; // Clear previous options
                    pets.forEach(pet => {
                        var option = document.createElement('option');
                        option.value = pet.pet_id; // Use pet_id instead of pet.id
                        option.textContent = pet.pet_name; // Use pet_name instead of pet.name
                        petSelect.appendChild(option);
                    });

                    // Show the modal
                    modal.style.display = 'block';
                })
                .catch(error => console.error('Error fetching pets:', error));
        }

        // Handle form submission
        var reservationForm = document.getElementById('reservationForm');
        reservationForm.addEventListener('submit', function (event) {
            event.preventDefault();

            var selectedPetId = document.getElementById('petSelect').value;
            var selectedTime = document.getElementById('timeSelect').value;
            var selectedPetName = document.querySelector(`#petSelect option[value="${selectedPetId}"]`).textContent;
            var reservationDate = document.getElementById('reservationDate').value;

            console.log('Reservation details:');
            console.log('Date:', reservationDate);
            console.log('Time:', selectedTime);
            console.log('Pet ID:', selectedPetId);
            console.log('Pet Name:', selectedPetName);

            // Add form submission logic here if necessary
        });

        // Modal close logic
        var span = document.getElementsByClassName('close')[0];
        var modal = document.getElementById('reservationModal'); // Ensure this points to your modal element

        span.onclick = function () {
            modal.style.display = 'none';
        }

        // Close the modal if the user clicks outside of it
        window.onclick = function (event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    });




    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    // Close dropdown when clicked outside
    window.onclick = function (event) {
        if (!event.target.matches('.profile-img')) {
            const dropdowns = document.getElementsByClassName('dropdown-menu');
            for (let i = 0; i < dropdowns.length; i++) {
                const openDropdown = dropdowns[i];
                if (openDropdown.style.display === 'block') {
                    openDropdown.style.display = 'none';
                }
            }
        }
    }

    function toggleNotification() {
        const notificationBox = document.getElementById('notificationBox');
        notificationBox.style.display = notificationBox.style.display === 'block' ? 'none' : 'block';
    }

    // Close notification box when clicking outside
    window.onclick = function (event) {
        if (!event.target.matches('.bell-icon')) {
            const notifications = document.getElementsByClassName('notification-box');
            for (let i = 0; i < notifications.length; i++) {
                const openNotification = notifications[i];
                if (openNotification.style.display === 'block') {
                    openNotification.style.display = 'none';
                }
            }
        }

        // Close profile dropdown as well if clicked outside
        if (!event.target.matches('.profile-img')) {
            const dropdowns = document.getElementsByClassName('dropdown-menu');
            for (let i = 0; i < dropdowns.length; i++) {
                const openDropdown = dropdowns[i];
                if (openDropdown.style.display === 'block') {
                    openDropdown.style.display = 'none';
                }
            }
        }
    }

    fetch('/current-user')
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('Failed to fetch user data');
            }
        })
        .then(data => {
            // Update UI to display current user's information
            const welcomeMessage = document.getElementById('clientUsername');
            welcomeMessage.textContent = `Welcome, ${data.user.username}`;
            // Load appointments once the user is known
            loadAppointments();
        })
        .catch(error => {
            console.error('Error fetching user data:', error);
        });

    // For logout link
    document.getElementById('logout-link').addEventListener('click', function (event) {
        event.preventDefault(); // Prevent the default link behavior

        // Display a confirmation dialog
        const confirmed = confirm('Are you sure you want to logout?');
        if (!confirmed) {
            return; // Do nothing if the user cancels the logout
        }

        // Perform logout via AJAX
        fetch('/logout', {
            method: 'POST'
        })
            .then(response => {
                if (response.ok) {
                    // Redirect to login page after successful logout
                    window.location.href = '/login.html';
                } else {
                    console.error('Logout failed:', response.statusText);
                }
            })
            .catch(error => {
                console.error('Error during logout:', error);
            });
    });

</script>

</html>
